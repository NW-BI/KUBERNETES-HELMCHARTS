{{- if .Values.parameter.ingress.oauth.enable }}
# Only enable this if .Values.parameters.ingress.oauth.enable is true

{{- $secret_name := printf "%s-oauth-proxy" .Release.Name }}
{{- $upstreams := list }}
{{- if and .Values.app.deployments (gt (len .Values.app.deployments) 0) }}
{{- range .Values.app.deployments }}
  {{- $route := .route | default "/" }}
  {{- if eq $route "/" }}
    {{- $upstreams = append $upstreams (printf "http://%s-service:%v/" .name .container.ports.containerPort) }}
  {{- else }}
    {{- $cleanRoute := $route | trimSuffix "/" }}
    {{- $upstreams = append $upstreams (printf "http://%s-service:%v%s" .name .container.ports.containerPort $cleanRoute) }}
    {{- $upstreams = append $upstreams (printf "http://%s-service:%v%s/" .name .container.ports.containerPort $cleanRoute) }}
  {{- end }}
{{- end }}
{{- else }}
{{- $upstreams = append $upstreams (printf "http://%s-service:%v" .Values.app.appName .Values.app.deployment.container.ports.containerPort) }}
{{- end }}
# SIEHE https://oauth2-proxy.github.io/oauth2-proxy/configuration/overview/
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: {{ .Release.Name }}-oauth-proxy
spec:
  chart:
    spec:
      chart: charts/oauth2-proxy
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: bitnami-legacy-gitrepo
        namespace: flux-system
      version: 7.x.x
  driftDetection:
    mode: enabled
  interval: 1h
  values:
    configuration:
      content: |-
        provider = "oidc"
        reverse_proxy = true
        set_xauthrequest = true
        pass_access_token = true
        pass_user_headers = true
        set_authorization_header = true
        oidc_issuer_url = "https://sts.windows.net/436dc4c0-9574-4f38-a8a7-cf6b84d8a0bd/"
        skip_provider_button = true
        email_domains = "*"
        {{- if and .Values.parameter.ingress.oauth.enabled_groups (gt (len .Values.parameter.ingress.oauth.enabled_groups) 0) }}
        allowed_groups = {{ .Values.parameter.ingress.oauth.enabled_groups | toJson }}
        {{- end }}
        upstreams = {{ $upstreams | toJson }}
      existingSecret: {{ $secret_name }}
    containerSecurityContext:
      enabled: true
    ingress:
      enabled: true
      certManager: {{ .Values.parameter.ingress.oauth.certManager }}
      hostname: {{ .Values.parameter.appHost }}
      tls: {{ .Values.parameter.ingress.oauth.tls }}
    pdb:
      create: true
      maxUnavailable: ""
      minAvailable: 1
    podSecurityContext:
      enabled: true
    redis:
      enabled: false
    replicaCount: 2
    resources:
      limits:
        cpu: 100m
        ephemeral-storage: 2Gi
        memory: 32Mi
      requests:
        cpu: 10m
        ephemeral-storage: 50Mi
        memory: 16Mi
---

apiVersion: v1
kind: Secret
metadata:
  name: {{ $secret_name }}
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  client-id: {{ .Values.secrets.oauthClientId }}
  client-secret: {{ .Values.secrets.oauthClientSecret }}
  cookie-secret: {{ include "common.secrets.passwords.manage" (dict "secret" $secret_name "key" "cookie-secret" "length" 32 "providedValues" (list) "failOnNew" false "skipB64enc" true "context" $) }}

{{- end }}
