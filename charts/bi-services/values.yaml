      enable: true
      enabled_groups: ["ROL-OMS-BI-Kubernetes","ROL-STK-BI-Kubernetes","ROL-HK-BI-Kubernetes","ROL-RGO-BI-Kubernetes","ROL-NWMS-BI-Kubernetes","ROL-NWL-BI-Kubernetes","ROL-OWLD-BI-Kubernetes","ROL-NW-BI-Kubernetes"]
middleware:
  names: []


